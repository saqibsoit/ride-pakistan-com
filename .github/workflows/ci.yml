name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, analyse, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ride_pakistan_testing
          MARIADB_USER: ride_pakistan
          MARIADB_PASSWORD: ride_pakistan
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # DB_CONNECTION and DB_DATABASE are forced by phpunit.xml (mariadb, ride_pakistan_testing).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: ride_pakistan
      DB_PASSWORD: ride_pakistan
      ADMIN_PATH: test-admin

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Set test database charset
        run: >-
          docker exec ${{ job.services.mariadb.id }}
          mariadb -uroot -proot
          -e "ALTER DATABASE ride_pakistan_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Tests (MariaDB)
        run: php artisan test

      - name: Composer audit
        run: composer audit

      - name: npm audit
        run: npm audit --audit-level=high
