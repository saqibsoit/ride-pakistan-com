name: CI

# Pushes to main run this through deploy.yml (tests gate every deploy).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when deploy.yml calls this, so the
# deploy's test run never cancels (or is cancelled by) a pull request run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, analyse, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ride_pakistan_testing
          MARIADB_USER: ride_pakistan
          MARIADB_PASSWORD: ride_pakistan
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # DB_CONNECTION and DB_DATABASE are forced by phpunit.xml (mariadb, ride_pakistan_testing).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: ride_pakistan
      DB_PASSWORD: ride_pakistan
      ADMIN_PATH: test-admin

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      # Browser tests need Playwright's Chromium. Only the browser is
      # downloaded (from Playwright's CDN): no --with-deps, so nothing comes
      # from the runner's apt mirror, whose outages broke CI. The
      # ubuntu-24.04 image ships Google Chrome, so Chromium's system
      # libraries are already there; the launch check below proves it.
      # The browser is cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium for browser tests
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              installed=yes
              break
            fi
            echo "::warning::Chromium install attempt ${attempt} of 3 failed."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done

          if [ "${installed:-no}" != yes ]; then
            echo "::error title=Chromium not installed::Playwright's Chromium could not be installed after 3 attempts, so the browser tests can't run. This is a download problem on the runner, not a test failure. Re-run the job later."
            exit 1
          fi

          # The browser must also start: a missing system library would only show up later, inside the tests.
          if ! node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "::error title=Chromium won't start::Playwright's Chromium installed but doesn't start on this runner (a system library is probably missing). Restore '--with-deps' on this step or install the missing package."
            exit 1
          fi

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Set test database charset
        run: >-
          docker exec ${{ job.services.mariadb.id }}
          mariadb -uroot -proot
          -e "ALTER DATABASE ride_pakistan_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Tests (MariaDB)
        run: php artisan test

      - name: Composer audit
        run: composer audit

      - name: npm audit
        run: npm audit --audit-level=high
