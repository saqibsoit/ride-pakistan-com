name: Hostinger SSH
description: Writes the deploy key and a pinned known_hosts entry, and defines the SSH host alias "hostinger".

inputs:
  ssh-host:
    description: Hostinger SSH host (hPanel, Advanced, SSH access)
    required: true
  ssh-port:
    description: SSH port (Hostinger uses 65002)
    required: false
    default: '65002'
  ssh-user:
    description: SSH user (u123456789)
    required: true
  ssh-private-key:
    description: Private key of the deploy key pair (its public key is added in hPanel)
    required: true
  ssh-known-hosts:
    description: Output of ssh-keyscan for the host, checked once by hand (DEPLOY.md)
    required: true

runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        set -euo pipefail
        for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set for this environment (docs/DEPLOY.md, GitHub setup)"
            exit 1
          fi
        done
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # Pinned host key: never trust on first use from CI.
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        cat > ~/.ssh/config <<EOF
        Host hostinger
          HostName ${SSH_HOST}
          Port ${SSH_PORT:-65002}
          User ${SSH_USER}
          IdentityFile ~/.ssh/deploy_key
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          ServerAliveInterval 30
        EOF
        chmod 600 ~/.ssh/config
        ssh hostinger 'echo "Connected to $(hostname)"'
